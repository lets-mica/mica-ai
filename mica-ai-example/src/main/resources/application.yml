server:
  port: 8080

spring:
  application:
    name: mica-ai-example
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
    encoding:
      force: true
      enabled: true
      charset: UTF-8

mica:
  ai:
    # ============================================================
    #   mica-ai 6 大能力统一开关：mica.ai.<cap>.enabled
    #   - true  （默认）: 必须配置好必填模型路径，否则启动失败
    #   - false         : 整个 Starter 不注入任何 Bean，可安全留空
    # ============================================================
    tts:
      enabled: false
    voice:
      enabled: false
    ppocr:
      enabled: false
    speaker:
      enabled: false
    intent:
      enabled: false
    face:
      enabled: false

# ----------------------------------------------------------------
# 启用示例（取消注释 + 替换模型路径即可激活对应 Starter）：
# ----------------------------------------------------------------
# mica:
#   ai:
#     tts:
#       enabled: true
#       model-path: E:/codes/ai/kokoro-onnx/model/model_dynamic.onnx
#       voices-dir: E:/codes/ai/kokoro-onnx/model/voices
#       config-path: E:/codes/ai/kokoro-onnx/model/config.json
#       default-voice: zf_001
#       default-speed: 1.0
#       onnx-provider: cpu
#     voice:
#       enabled: true
#       encoder-path: E:/codes/ai/SenseVoice-ONNX/model/SenseVoice-Encoder.fp32.onnx
#       decoder-path: E:/codes/ai/SenseVoice-ONNX/model/SenseVoice-CTC.fp32.onnx
#       tokenizer-path: E:/codes/ai/SenseVoice-ONNX/model/Tokenizer.bpe.model
#       onnx-provider: cpu
#       itn: true
#       top-k: 10
#       hotwords:
#         - mica
#         - 梦想卢
