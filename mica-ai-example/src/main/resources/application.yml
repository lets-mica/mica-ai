server:
  port: 8181

spring:
  application:
    name: mica-ai-example
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
    encoding:
      force: true
      enabled: true
      charset: UTF-8

mica:
  ai:
    # ============================================================
    #  🎭 Face —— YuNet + SFace + MiniFASNetV2（Apache-2.0 OpenCV Zoo）
    #  模型路径可填 classpath:... 或绝对文件系统路径，未配置时启动失败。
    # ============================================================
    face:
      model:
        detection:
          path: classpath:models/face_detection_yunet_2023mar.onnx
        recognition:
          path: classpath:models/face_recognition_sface_2021dec.onnx
        liveness:
          path: classpath:models/2.7_80x80_MiniFASNetV2.onnx
      detection:
        threshold: 0.9
        nms-threshold: 0.3
      liveness:
        enabled: true
        threshold: 0.85
        crop-scale: 2.7
      verify:
        threshold: 0.35
      device: cpu
    # ============================================================
    #  📄 Filetype —— Google Magika standard_v3_3（Apache-2.0）
    #  路径留空走 classpath: mica-ai/models/filetype/standard_v3_3/*
    #  也可直接给绝对路径指向 model-tools/filetype/model/out/{model.onnx,config.min.json,content_types_kb.min.json}
    # ============================================================
    filetype:
      model-version: standard_v3_3
      prediction-mode: HIGH_CONFIDENCE
      device: cpu

logging:
  level:
    root: INFO
    net.dreamlu.mica.ai: INFO
    org.springframework: WARN