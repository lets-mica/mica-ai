server:
  port: 8181

spring:
  application:
    name: mica-ai-example
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB
    encoding:
      force: true
      enabled: true
      charset: UTF-8

mica:
  ai:
    # ============================================================
    #  🎭 Face —— YuNet + SFace + MiniFASNetV2（Apache-2.0 OpenCV Zoo）
    #  模型路径可填 classpath:... 或绝对文件系统路径，未配置时启动失败。
    # ============================================================
    face:
      model:
        detection:
          path: classpath:models/face_detection_yunet_2023mar.onnx
        recognition:
          path: classpath:models/face_recognition_sface_2021dec.onnx
        liveness:
          path: classpath:models/2.7_80x80_MiniFASNetV2.onnx
      detection:
        threshold: 0.9
        nms-threshold: 0.3
      liveness:
        enabled: true
        threshold: 0.85
        crop-scale: 2.7
      verify:
        threshold: 0.35
      device: cpu

logging:
  level:
    root: INFO
    net.dreamlu.mica.ai: INFO
    org.springframework: WARN