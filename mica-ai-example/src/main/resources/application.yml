server:
  port: 8181

spring:
  application:
    name: mica-ai-example
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 100MB

mica:
  ai:
    # ============================================================
    #  🔧 通用 ONNX Runtime 配置（每个能力下都有 onnx 节点）
    # ------------------------------------------------------------
    #  字段含义（默认值见 OrtSessionOptions.builder()）：
    #    device                    CPU（默认）/ GPU
    #    cuda-device-id            仅 device=GPU 时生效，多卡机器选 0/1/...
    #    intra-op-num-threads      算子内并行线程数；0 = ORT 自适应（默认）
    #    inter-op-num-threads      算子间并行线程数；0 = 串行（默认）
    #    graph-optimization-level  DISABLE_ALL / ENABLE_BASIC /
    #                              ENABLE_EXTENDED / ENABLE_ALL（默认）
    #    execution-mode            SEQUENTIAL / PARALLEL（默认）
    #    enable-cpu-mem-arena      false（默认，跨多 session 时建议保持关闭）
    #    enable-memory-pattern     false（默认，输入 shape 多变时建议保持关闭）
    #    symbolic-dimension-values { }  把动态维度固化（一般不用）
    #  小贴士：
    #   - CPU 多核机器把 intra-op-num-threads 设为物理核数即可
    #   - 启用 GPU 需部署环境含 onnxruntime_gpu + CUDA/cuDNN，且模型算子在 EP 支持范围内
    #   - 共享同一 OrtEnvironment 的多 session 不要开启 memory-pattern，
    #     否则会按「首次 shape」缓存，后续变 shape 会触发重分配
    # ============================================================
    # ============================================================
    #  🎭 Face —— YuNet + SFace + MiniFASNetV2（Apache-2.0 OpenCV Zoo）
    #  模型路径可填 classpath:... 或绝对文件系统路径，未配置时启动失败。
    # ============================================================
    face:
      model:
        detection:
          path: model-tools/face/models/face_detection_yunet_2023mar.onnx
        recognition:
          path: model-tools/face/models/face_recognition_sface_2021dec.onnx
        liveness:
          path: model-tools/face/models/2.7_80x80_MiniFASNetV2.onnx
        # eDifFIQA-Tiny 人脸质量评估（CC-BY-4.0，署名即可商用）
        quality:
          path: model-tools/face/models/ediffiqa_tiny_jun2024.onnx
        # Progressive Teacher 表情识别 7 类（Apache-2.0）
        expression:
          path: model-tools/face/models/facial_expression_recognition_mobilefacenet_2022july.onnx
      detection:
        threshold: 0.9
        nms-threshold: 0.3
      liveness:
        enabled: true
        threshold: 0.85
        crop-scale: 2.7
      verify:
        threshold: 0.35
      # 单图多脸时的选脸策略：LARGEST_AREA（默认，面积最大）/ LARGEST_SCORE / REJECT（多脸直接拒绝）
      strategy: LARGEST_AREA
      # eDifFIQA 质量门控：低于阈值直接判为质量不合格
      quality:
        enabled: true
        threshold: 0.5
      # 表情识别：angry / disgust / fearful / happy / neutral / sad / surprised
      expression:
        enabled: true
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0   # 0 = ORT 自适应，按物理核数设置可获最佳 CPU 吞吐
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values:
        #   batch: 1
    # ============================================================
    #  📄 Filetype —— Google Magika standard_v3_3（Apache-2.0）
    #  路径留空走 classpath: mica-ai/models/filetype/standard_v3_3/*
    #  也可直接给绝对路径指向 model-tools/filetype/models/{model.onnx,config.min.json,content_types_kb.min.json}
    # ============================================================
    filetype:
      model-version: standard_v3_3
      model-path: model-tools/filetype/models/model.onnx
      config-path: model-tools/filetype/models/config.min.json
      content-types-path: model-tools/filetype/models/content_types_kb.min.json
      prediction-mode: HIGH_CONFIDENCE
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }
    # ============================================================
    #  🚗 Plate —— HyperLPR3 v20230229（Apache-2.0）
    #  模型路径未配置时启动失败；模型已入库，见 model-tools/plate/models/
    # ============================================================
    plate:
      model-version: "20230229"
      detection-model-path: model-tools/plate/models/y5fu_320x_sim.onnx
      recognition-model-path: model-tools/plate/models/rpv3_mdict_160_r3.onnx
      classification-model-path: model-tools/plate/models/litemodel_cls_96x_r1.onnx
      detection-input-size: 320
      detection-confidence-threshold: 0.25
      detection-nms-threshold: 0.5
      max-plates: 5
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }
    # ============================================================
    #  📐 Layout —— PP-DocLayoutV3（Apache-2.0）
    #  ⚠️ enabled=false：模型 125MB，超出「<50MB 入库」约定，入库方式待决策，
    #  新克隆的仓库里没有 model.onnx，开启会导致启动失败（模型路径未配置/不存在即 fail-fast）。
    #  本地已有模型时：enabled 置 true，或按需用 -Dmica.ai.layout.enabled=true 覆盖。
    # ============================================================
    layout:
      enabled: false
      model-version: v3
      model-path: model-tools/layout/models/model.onnx
      max-side-length: 800
      score-threshold: 0.4
      # 相对阈值：有效阈值 = max(score-threshold, top1 × score-ratio)。
      # 0.6 可抑制同页分数悬崖下方的长尾误检，同时兼容单列裁剪图（整体分数偏低）的场景。
      # 设为 0 表示不启用（只走绝对阈值）。
      score-ratio: 0.6
      max-detections: 100
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }
    # ============================================================
    #  ✂️ Matting —— U²-Net u2netp 通用抠图（Apache-2.0）
    #  模型 4.36MB，已入库（model-tools/matting/models/u2netp.onnx），可安全开启。
    #  换模型：同族的 u2net（168MB，通用显著性完整版）/ u2net_human_seg（168MB，人体分割）
    #  契约与 u2netp 完全一致，只需改 model-path 指向本地文件，Java 代码零改动。
    #  min-max-normalize：把相对显著性拉伸到满 alpha 区间，低对比度图建议保持 true。
    # ============================================================
    matting:
      enabled: true
      model-version: u2netp
      model-path: model-tools/matting/models/u2netp.onnx
      input-size: 320
      output-select: AUTO
      binary-threshold: 0.5
      min-max-normalize: true
      background-color: [ 255, 255, 255 ]
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }
    # ============================================================
    #  🔤 TextLine —— PP-LCNet 文本行方向分类（Apache-2.0）
    #  模型 6.46MB，已入库（model-tools/textline/models/PP-LCNet_x1_0_textline_ori.onnx）。
    #  判定一条已定位的文本行是 0 度还是 180 度（倒置），供 OCR 前置转正。
    #  换模型：轻量版 PP-LCNet_x0_25_textline_ori（约 0.96MB）契约一致，改 model-path 即可。
    #  upside-down-threshold：判定为倒置的最低概率。实测真实扫描件上倒置态仅得
    #  p≈0.58（合成图可达 0.73），若误旋转代价高可调高到 0.6~0.7 让其保持不动。
    # ============================================================
    textline:
      enabled: true
      model-version: PP-LCNet_x1_0_textline_ori
      model-path: model-tools/textline/models/PP-LCNet_x1_0_textline_ori.onnx
      input-width: 160
      input-height: 80
      channel-order: BGR
      upside-down-threshold: 0.5
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }
    # ============================================================
    #  🔐 Captcha —— ddddocr 通用验证码识别（MIT）
    #  模型 12.98MB，已入库（model-tools/captcha/models/ddddocr.onnx），
    #  但**不打包进 jar**，必须指向本地文件；charset-path 为配套字符集，必须与模型成对。
    #  normalization：DIV_255（默认）/ MEAN_0_5（对齐 ddddocr Python 原版）。
    #  实测本动态量化模型对两者不敏感，两者解码结果一致。
    # ============================================================
    captcha:
      enabled: true
      model-path: model-tools/captcha/models/ddddocr.onnx
      charset-path: model-tools/captcha/models/charset.txt
      input-height: 64
      normalization: DIV_255
      interpolation: BILINEAR
      png-fix: true
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }

    # ============================================================
    #  🎯 Detect —— NanoDet-Plus / YOLOX-s 通用目标检测（Apache-2.0）
    #  两个模型都已入库（model-tools/detect/models/）：
    #    NanoDet-Plus 3.62MB（默认，416×416）/ YOLOX-s 34.2MB（640×640）
    #  ⚠️ 切换模型族必须成对改 family + input-size —— 两族的预处理 / 解码 / NMS 契约不同，
    #     只改其一会因输入边长与模型张量形状不符而启动失败。
    # ============================================================
    detect:
      enabled: true
      family: NANODET_PLUS
      model-path: model-tools/detect/models/object_detection_nanodet_2022nov.onnx
      input-size: 416
      score-threshold: 0.35
      nms-threshold: 0.6
      max-detections: 100
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }
    # ============================================================
    #  🧭 Track —— ByteTrack 多目标跟踪（MIT，纯算法零模型）
    #  high-threshold：高分框分界线；low-threshold：低分框丢弃线（两轮匹配都进不去）
    #  match-thresh：第一轮（高分 det ↔ 轨迹）IoU 阈值
    #  match-low-thresh：第二轮（低分 det ↔ 未匹配轨迹）IoU 阈值
    #  confirm-age：新轨迹连续命中多少帧才算成熟（成熟轨迹优先返回）
    #  track-buffered-thresh：连续多少帧未命中就丢弃该轨迹
    # ============================================================
    track:
      enabled: true
      high-threshold: 0.6
      low-threshold: 0.1
      match-thresh: 0.8
      match-low-thresh: 0.5
      track-buffered-thresh: 30
      confirm-age: 3
    # ============================================================
    #  👤 HumanSeg —— PP-HumanSeg V2-Lite 人像分割（Apache-2.0）
    #  模型 5.88MB，已入库（model-tools/humanseg/models/），192×192 输入。
    #  换模型：竖版 Portrait-PP-HumanSegV2-Lite（256×144）契约一致，
    #  改 model-path + 成对改 input-width / input-height 即可。
    # ============================================================
    humanseg:
      enabled: true
      model-version: human_segmentation_pphumanseg_2023mar
      model-path: model-tools/humanseg/models/human_segmentation_pphumanseg_2023mar.onnx
      input-width: 192
      input-height: 192
      binary-threshold: 0.5
      background-color: [ 255, 255, 255 ]
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }
    # ============================================================
    #  📸 DocAlign —— DocAligner 文档角点检测 + 透视矫正（Apache-2.0）
    #  模型 4.55MB，已入库（model-tools/docalign/models/）。
    #  heatmap-threshold：热力图二值化阈值（上游默认 0.3），越大角点越保守。
    #  ⚠️ 角点为热力图连通域质心，天然向文档内部收缩约 10~23px。
    # ============================================================
    docalign:
      enabled: true
      model-version: lcnet100_h_e_bifpn_256_fp32
      model-path: model-tools/docalign/models/lcnet100_h_e_bifpn_256_fp32.onnx
      input-width: 256
      input-height: 256
      heatmap-threshold: 0.3
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }
    # ============================================================
    #  ✨ Enhance —— Real-ESRGAN 图像超分（BSD-3-Clause）
    #  模型 2.33MB，已入库（model-tools/enhance/models/）。
    #  scale：放大倍数，必须与模型实际输出一致，否则推理期直接抛异常。
    #  tile-size / tile-overlap：大图自动切 tile 推理，重叠区用于消除拼接接缝。
    # ============================================================
    enhance:
      enabled: true
      model-version: realesr-general-x4v3
      model-path: model-tools/enhance/models/realesr-general-x4v3.onnx
      scale: 4
      tile-size: 256
      tile-overlap: 16
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }
    # ============================================================
    #  🔎 Classify —— PaddleClas PULC 通用图像分类（Apache-2.0）
    #  ⚠️ 一个引擎绑定「一个模型 + 一份 label_list」，两者必须成对配置，缺一启动即 fail-fast。
    #  ⚠️ labels-path 无 classpath 兜底 —— 分类模型不打包进 jar，必须指向本地文件。
    #  这里配的是默认模型（整图方向 0/90/180/270）；
    #  其余 3 个 PULC 模型见下方 mica.example.classify.models。
    # ============================================================
    classify:
      enabled: true
      model-version: text_image_orientation
      model-path: model-tools/classify/models/text_image_orientation.onnx
      labels-path: model-tools/classify/models/text_image_orientation_labels.txt
      input-width: 224
      input-height: 224
      # 短边缩放 + 中心裁剪（PULC 官方默认 256 → 224）；
      # table_attribute 这类官方直接 resize 的模型要置 0
      resize-short: 256
      channel-order: RGB
      multi-label: false
      output-is-probability: true
      top-k: 1
      onnx:
        device: CPU
        # cuda-device-id: 0
        # intra-op-num-threads: 0
        # inter-op-num-threads: 0
        # graph-optimization-level: ENABLE_ALL
        # execution-mode: PARALLEL
        # enable-cpu-mem-arena: false
        # enable-memory-pattern: false
        # symbolic-dimension-values: { }
  # ============================================================
  #  🔎 示例专用：PULC 多模型扩展
  #  starter 的 classify 一个引擎只绑一个模型；要同时用多个 PULC 模型，
  #  就再声明引擎 —— 这里用 mica.example.classify.models 声明另外 3 个，
  #  按需（首次调用该模型时）懒加载，不占启动内存。
  # ============================================================
  example:
    classify:
      models:
        # 清晰 / 模糊二分类
        clarity:
          model-path: model-tools/classify/models/clarity_assessment.onnx
          labels-path: model-tools/classify/models/clarity_assessment_labels.txt
        # 画面有人 / 无人二分类
        person:
          model-path: model-tools/classify/models/person_exists.onnx
          labels-path: model-tools/classify/models/person_exists_labels.txt
        # 表格 6 属性（source / number / color / clarity / obstruction / angle）
        # 官方配置是直接 resize 到 224（resize-short 置 0），且各属性独立 sigmoid（多标签）
        table:
          model-path: model-tools/classify/models/table_attribute.onnx
          labels-path: model-tools/classify/models/table_attribute_labels.txt
          resize-short: 0
          multi-label: true
          top-k: 6

logging:
  level:
    root: INFO
    net.dreamlu.mica.ai: INFO
    org.springframework: WARN
